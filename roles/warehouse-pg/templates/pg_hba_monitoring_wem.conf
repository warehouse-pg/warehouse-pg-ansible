# pg_hba entries for WEM monitoring access.
# Applied as a block by 11-update-pg-hba.yml via blockinfile.

# WEM: allow whpg_user to connect from localhost
host    all             {{ whpg_user }}  127.0.0.1/32           md5
{% set _wem_host_ip = hostvars[groups['wem_stack'][0]]['ip_address'] if groups['wem_stack'] | default([]) | length > 0 else '' %}
{% if _wem_host_ip %}
# WEM: allow gpadmin and whpg_user to connect from the WEM host (standby or monitoring).
# The WEM host's IP is looked up directly from the wem_stack inventory group
# here (it holds exactly the host running WEM; see Testing/main.tf's
# wem_monitoring_groups_* locals) instead of being passed in as a variable.
host    all             gpadmin          {{ _wem_host_ip }}/32   md5
host    all             {{ whpg_user }}  {{ _wem_host_ip }}/32   md5
{% endif %}
