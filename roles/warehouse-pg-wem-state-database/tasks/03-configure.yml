---

# Remote host rules use password auth. Loopback keeps whatever it has unless
# wem_state_db_local_trust says otherwise (see defaults).
- name: Replace ident with md5 for host connections in pg_hba.conf
  ansible.builtin.replace:
    path: "{{ pg_data_dir }}/pg_hba.conf"
    regexp: '^(host\s+\S+\s+\S+\s+\S+)\s+ident$'
    replace: '\1 md5'
  become: true
  become_user: postgres
  notify: Reload postgresql

- name: Set trust auth for loopback connections in pg_hba.conf
  ansible.builtin.replace:
    path: "{{ pg_data_dir }}/pg_hba.conf"
    regexp: '^(host\s+all\s+all\s+(?:127\.0\.0\.1/32|::1/128))\s+\S+'
    replace: '\1 trust'
  become: true
  become_user: root
  notify: Reload postgresql
  when: _wem_state_db_trust_requested | bool

- name: Require passwords for loopback connections in pg_hba.conf
  ansible.builtin.replace:
    path: "{{ pg_data_dir }}/pg_hba.conf"
    regexp: '^(host\s+all\s+all\s+(?:127\.0\.0\.1/32|::1/128))\s+trust$'
    replace: '\1 md5'
  become: true
  become_user: root
  notify: Reload postgresql
  when: _wem_state_db_trust_forbidden | bool
