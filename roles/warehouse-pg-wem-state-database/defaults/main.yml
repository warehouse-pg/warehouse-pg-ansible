---

# PostgreSQL version to install (AppStream module stream)
pg_version: "15"

# Service name
pg_service: "postgresql"

# Data directory (set by initdb)
pg_data_dir: "/var/lib/pgsql/data"

# Port
pg_port: 5433

# WEM state database
wem_state_db_host: "127.0.0.1"
wem_state_db_port: "{{ pg_port }}"
wem_state_db: "wem"
wem_state_db_user: "wem_admin"
# Password for the WEM state database user. Required unless trust auth is in
# effect for loopback (see wem_state_db_local_trust). 
wem_state_db_password: ""

# Authentication for loopback (127.0.0.1 and ::1) connections to the state DB:
#   ""       leave pg_hba.conf as it is: a new install uses password auth, and
#            an existing install keeps whatever it has, including trust
#   true     trust on loopback; the password may be empty (anyone with a shell
#.           on the host can then connect to the state database)
#   false    password auth on loopback, replacing trust if present; a password
#            is required
wem_state_db_local_trust: ""
