---

# Package name from EDB repository
acp_agent_package_name: "edb-acp-host-agent"
# Pin a specific RPM version (e.g. "1.2.3"). Leave empty to install whatever
# version the configured EDB repository provides.
acp_agent_version: ""
# Accepted values:
#   "install-but-no-automatic-upgrades" — install if missing, never auto-upgrade (default)
#   "always-upgrade-to-latest-minor"    — upgrade to latest on every run
#   "absent"                            — remove the package
acp_agent_upgrade: "install-but-no-automatic-upgrades"

DNF_TIMEOUT: 120
# Throttle concurrent installs to avoid hitting EDB repository retry limits
serial_operations: 1

# Systemd service name (matches the name installed by the RPM)
acp_agent_service_name: "acp-host-agent"

# Config file path (EnvironmentFile sourced by acp-host-agent.service)
acp_agent_config_file: "/etc/edb/acp-host-agent/acp-host-agent.conf"

# =============================================================================
# WEM Connection (REQUIRED)
# =============================================================================
# WEM_CONNECT_ADDRESS is the WEM relay address: wem_host_ip:(wem_port+1).
# The agent connects to WEM's relay port.
# Set wem_connect_host / wem_port in inventory / group_vars to point at the
# wem_stack host when WEM runs on a different host.
# Derived from the wem_host inventory entry (ip_address / port); falls back to
# 127.0.0.1 / 8080 when wem_host is not set or not in inventory.
wem_connect_host: "{{ hostvars[wem_host]['ip_address'] if wem_host is defined and wem_host in hostvars and 'ip_address' in hostvars[wem_host] else '127.0.0.1' }}"
wem_port: "{{ hostvars[wem_host]['port'] if wem_host is defined and wem_host in hostvars and 'port' in hostvars[wem_host] else 8080 }}"
# WEM_CONNECT_ADDRESS = wem_connect_host:(wem_port+1)
wem_connect_address: "{{ wem_connect_host }}:{{ wem_port | int + 1 }}"

# Task queue(s) this agent polls for activities (optional).
# Comma-separated to poll multiple queues, e.g.: coordinator-tasks,standby-tasks
# Auto-derived from whpg_role if not explicitly set in inventory.
# Leave empty to let the agent use its built-in default.
# Here the queyes for coordinator and standby are set, all other hosts are left
# empty and will be dynamically set by ACP Host Agent.
wem_task_queues: >-
  {{ 'coordinator-tasks' if whpg_role == 'coordinator'
     else ('standby-tasks' if whpg_role == 'standby'
     else '') }}

# =============================================================================
# Agent Identity (optional)
# =============================================================================
# Stable per-host identifier. Leave empty to auto-derive from DMI UUID / MAC.
agent_id: ""

# Directory where the Ed25519 enrollment keypair is stored.
# Leave empty to keep the RPM default (/var/lib/edb/acp-host-agent).
agent_state_dir: ""

# =============================================================================
# WEM Database (optional)
# =============================================================================
# WHPG database psql connects to for WEM data (default: wem if unset).
wem_database: ""

# =============================================================================
# WarehousePG Hub (optional — WHPG coordinator hosts only)
# =============================================================================
# WHPG port used to discover the coordinator's data directory via psql.
whpg_port: 5432

# Unix user that owns the WarehousePG installation.
WHPG_UNIX_USER: "gpadmin"
greenplum_path: "/usr/edb/whpg7/greenplum_path.sh"

# =============================================================================
# Logging
# =============================================================================
# Log level: error | warn | info | debug | trace
# Per-module syntax: info,host_agent=debug
agent_log_level: "info"
