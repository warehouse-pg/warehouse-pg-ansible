---

# The whpg-enterprise-manager RPM ships /etc/edb/wem/wem.conf with
# %config(noreplace) and the %post scriptlet auto-generates WEM_COOKIE_SECRET
# and WEM_ADMIN_PASSWORD when they are empty. We edit that file in place
# rather than overwriting it from a template, so:
#   - the commented examples the RPM ships (PXF, receiver, performance,
#     etc.) stay visible to operators reading the file;
#   - upstream additions to the shipped config arrive without role changes;
#   - the RPM's auto-generated secrets are preserved naturally — we only
#     touch a line when the corresponding Ansible variable is non-empty.
#
# The regexp `^#?\s*<KEY>=` matches both the uncommented form and the
# commented "# <KEY>=..." example shipped in /etc/edb/wem/wem.conf, so setting
# any optional knob also uncomments its example line.

# wem.conf holds database passwords and the cookie secret. The wem.service unit
# runs as the RPM's dedicated `wem` account and systemd reads the file as root,
# so only root and the `wem` group get access; gpadmin has none.
- name: Ensure /etc/edb/wem/wem.conf ownership and mode
  ansible.builtin.file:
    path: "{{ wem_config_file }}"
    owner: root
    group: "{{ wem_service_group }}"
    mode: "0640"
  become: true
  become_user: root

# "false" / "0" / "no" explicitly request secure cookies; an empty value means
# "leave the file alone".
- name: Empty WEM_INSECURE_COOKIES when secure cookies are requested
  ansible.builtin.lineinfile:
    path: "{{ wem_config_file }}"
    regexp: "^#?\\s*WEM_INSECURE_COOKIES="
    line: "WEM_INSECURE_COOKIES="
    state: present
  become: true
  become_user: root
  when: _wem_secure_cookies_requested
  notify: Restart wem

- name: Set required WEM connection values in /etc/edb/wem/wem.conf
  ansible.builtin.lineinfile:
    path: "{{ wem_config_file }}"
    regexp: "^#?\\s*{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    state: present
  loop: >-
    {{ [
      { 'key': 'WHPG_HOST',            'value': whpg_host },
      { 'key': 'WHPG_PORT',            'value': whpg_port | string },
      { 'key': 'WHPG_DATABASE',        'value': whpg_database | default('') },
      { 'key': 'WHPG_USER',            'value': whpg_user },
      { 'key': 'WHPG_PASSWORD',        'value': whpg_password },
      { 'key': 'WEM_HOST',             'value': wem_state_db_host },
      { 'key': 'WEM_PORT',             'value': wem_state_db_port | string },
      { 'key': 'WEM_DATABASE',         'value': wem_state_db | default('') },
      { 'key': 'WEM_USER',             'value': wem_state_db_user },
      { 'key': 'WEM_PASSWORD',         'value': wem_state_db_password | default('') },
      { 'key': 'PORT',                          'value': wem_port | string },
      { 'key': 'WEM_INSECURE_COOKIES',          'value': '' if _wem_secure_cookies_requested else wem_insecure_cookies },
      { 'key': 'WEM_AGENT_CALLBACK_BASE_URL',   'value': wem_agent_callback_base_url },
    ] | selectattr('value', 'ne', '') | list }}
  become: true
  become_user: root
  notify: Restart wem
  no_log: true

# Cookie secret and admin password are auto-generated by the RPM %post when
# the shipped value is empty. We only overwrite them when the operator
# provided an explicit non-empty value via Ansible variables — otherwise the
# RPM-generated value stays in place across runs.
- name: Set WEM_COOKIE_SECRET when explicitly provided
  ansible.builtin.lineinfile:
    path: "{{ wem_config_file }}"
    regexp: "^#?\\s*WEM_COOKIE_SECRET="
    line: "WEM_COOKIE_SECRET={{ wem_cookie_secret }}"
    state: present
  become: true
  become_user: root
  when: wem_cookie_secret | length > 0
  notify: Restart wem
  no_log: true

- name: Set WEM_ADMIN_PASSWORD when explicitly provided
  ansible.builtin.lineinfile:
    path: "{{ wem_config_file }}"
    regexp: "^#?\\s*WEM_ADMIN_PASSWORD="
    line: "WEM_ADMIN_PASSWORD={{ wem_admin_password }}"
    state: present
  become: true
  become_user: root
  when: wem_admin_password | length > 0
  notify: Restart wem
  no_log: true

# Optional knobs — shipped as commented examples in the RPM's wem.conf.
# Each is emitted (uncommented) only when its Ansible variable is non-empty;
# otherwise the shipped commented example is left in place.
- name: Set optional WEM configuration values when provided
  ansible.builtin.lineinfile:
    path: "{{ wem_config_file }}"
    regexp: "^#?\\s*{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    state: present
  loop: >-
    {{ [
      { 'key': 'HIGH_LOAD_MODE',                     'value': wem_high_load_mode | default('') },
      { 'key': 'WHPG_MONITORING_DB',                 'value': whpg_monitoring_db | default('') },
      { 'key': 'LONG_RUNNING_THRESHOLD',             'value': wem_long_running_threshold | default('') },
      { 'key': 'CLICKHOUSE_URL',                     'value': wem_clickhouse_url | default('') },
      { 'key': 'OTEL_GATEWAY_ENDPOINT',             'value': gateway_collector_endpoint | default('') },
      { 'key': 'WHPG_OS_USER',                       'value': wem_whpg_os_user | default('') },
      { 'key': 'WHPG_PXF_BIN',                       'value': wem_whpg_pxf_bin | default('') },
      { 'key': 'WHPG_PXF_BASE',                      'value': wem_whpg_pxf_base | default('') },
      { 'key': 'WHPG_PXF_OP_TIMEOUT_SECONDS',        'value': wem_whpg_pxf_op_timeout_seconds | default('') },
      { 'key': 'WHPG_ALLOW_ROOT',                    'value': wem_whpg_allow_root | default(false, true) | bool | string | lower },
    ] | selectattr('value', 'ne', '') | list }}
  become: true
  become_user: root
  notify: Restart wem
  no_log: true
