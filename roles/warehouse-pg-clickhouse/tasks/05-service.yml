---

# clickhouse-server is managed through its systemd unit, so that it starts
# at boot and systemctl, monitoring and this role agree on its state.
#
# `clickhouse start` (used by earlier versions of this role) daemonizes the
# server outside systemd and leaves the unit enabled but inactive; a later
# `systemctl start` or a reboot then competes with that process. Hand such
# a server over to systemd once.
- name: Start/stop clickhouse-server via systemd
  become: true
  become_user: root
  block:
    - name: Check whether clickhouse-server is active under systemd
      ansible.builtin.command:
        cmd: "systemctl is-active {{ clickhouse_service_name }}"
      register: _ch_systemd_active
      changed_when: false
      failed_when: false

    - name: Check whether clickhouse-server is running outside systemd
      ansible.builtin.command:
        cmd: "clickhouse status"
      register: _ch_cli_status
      changed_when: false
      failed_when: false
      when: _ch_systemd_active.rc != 0

    - name: Stop clickhouse-server started outside systemd
      ansible.builtin.command:
        cmd: "clickhouse stop"
      changed_when: true
      when:
        - _ch_systemd_active.rc != 0
        - _ch_cli_status.rc | default(1) == 0

    - name: Start and enable clickhouse-server
      ansible.builtin.systemd:
        name: "{{ clickhouse_service_name }}"
        state: started
        enabled: true
      when: clickhouse_service_started | bool

    - name: Stop and disable clickhouse-server
      ansible.builtin.systemd:
        name: "{{ clickhouse_service_name }}"
        state: stopped
        enabled: false
      when: not (clickhouse_service_started | bool)

  rescue:
    - name: Collect clickhouse-server status
      ansible.builtin.command:
        cmd: "systemctl status {{ clickhouse_service_name }} --no-pager"
      register: _ch_status
      changed_when: false
      failed_when: false

    - name: Collect clickhouse-server journal logs
      ansible.builtin.command:
        cmd: "journalctl -xeu {{ clickhouse_service_name }} -n 100 --no-pager"
      register: _ch_journal
      changed_when: false
      failed_when: false

    - name: Print clickhouse-server status
      ansible.builtin.debug:
        msg: "{{ _ch_status.stdout_lines }}"

    - name: Print clickhouse-server journal logs
      ansible.builtin.debug:
        msg: "{{ _ch_journal.stdout_lines }}"

    - name: Fail with diagnostic hint
      ansible.builtin.fail:
        msg: >-
          clickhouse-server failed to start. Check status and logs printed above.
          Common causes: port {{ clickhouse_tcp_port }} or {{ clickhouse_http_port }}
          already in use, or malformed config.xml.
