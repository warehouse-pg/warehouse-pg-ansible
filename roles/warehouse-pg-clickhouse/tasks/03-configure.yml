# Settings managed:
#   - listen_host  (network — loopback + private IP, one entry per address)
#   - http_port / tcp_port
#   - logger level / log / errorlog

- name: Write network override (listen_host, ports) into config.d/
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/config.d/99-ansible-network.xml
    owner: clickhouse
    group: clickhouse
    mode: "0640"
    content: |
      <clickhouse>
        <!-- Listen only on these addresses (set via Ansible: clickhouse_listen_hosts) -->
      {% for host in clickhouse_listen_hosts %}
        <listen_host>{{ host }}</listen_host>
      {% endfor %}
        <http_port>{{ clickhouse_http_port }}</http_port>
        <tcp_port>{{ clickhouse_tcp_port }}</tcp_port>
      </clickhouse>
  become: true
  become_user: root
  notify: Restart clickhouse-server

- name: Write logger override into config.d/
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/config.d/99-ansible-logger.xml
    owner: clickhouse
    group: clickhouse
    mode: "0640"
    content: |
      <clickhouse>
        <logger>
          <level>{{ clickhouse_log_level }}</level>
          <log>{{ clickhouse_log_file }}</log>
          <errorlog>{{ clickhouse_error_log_file }}</errorlog>
        </logger>
      </clickhouse>
  become: true
  become_user: root
  notify: Restart clickhouse-server
