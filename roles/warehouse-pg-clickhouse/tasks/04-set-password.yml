# ClickHouse merges all XML files in users.d/ at startup, so the shipped
# users.xml is left untouched.

- name: Ensure /etc/clickhouse-server/users.d directory exists
  ansible.builtin.file:
    path: /etc/clickhouse-server/users.d
    state: directory
    owner: clickhouse
    group: clickhouse
    mode: "0750"
  become: true
  become_user: root

- name: Write ClickHouse user override
  ansible.builtin.copy:
    dest: /etc/clickhouse-server/users.d/ansible-users.xml
    owner: clickhouse
    group: clickhouse
    mode: "0640"
    content: |
      <clickhouse>
          <users>
              <{{ clickhouse_user }}>
                  <password>{{ clickhouse_password | e }}</password>
                  <networks>
                      <ip>::/0</ip>
                  </networks>
                  <profile>default</profile>
                  <quota>default</quota>
                  <access_management>1</access_management>
              </{{ clickhouse_user }}>
              <default>
                  <networks replace="replace">
                      <ip>::1</ip>
                      <ip>127.0.0.1</ip>
                  </networks>
              </default>
          </users>
      </clickhouse>
  become: true
  become_user: root
  no_log: true
  notify: Restart clickhouse-server

# Superseded by ansible-users.xml (earlier versions of this role set a
# password on the default user here).
- name: Remove old default user password override
  ansible.builtin.file:
    path: /etc/clickhouse-server/users.d/default-password.xml
    state: absent
  become: true
  become_user: root
  notify: Restart clickhouse-server
