---

# Variables consumed by this Playbook:
#
# These are shared between the warehouse-pg role (deploy) and the
# warehouse-pg-cluster-data role (snapshot). Defaults are defined inside
# each role's defaults/main.yml. Override them by uncommenting the
# `vars:` blocks on the plays below, by setting them in inventory /
# group_vars / host_vars, or via -e on the command line.
#
#   WHPG_UNIX_USER   Unix user that owns the WarehousePG installation
#                    and receives the cluster_state files in its home
#                    directory.
#                    Default: "gpadmin"
#   WHPG_UNIX_GROUP  Unix group that owns WarehousePG files and the
#                    cluster_state files.
#                    Default: "gpadmin"
#   greenplum_path   Path to greenplum_path.sh; sourced before running
#                    psql/gpstate/etc.
#                    Default: "/usr/edb/whpg7/greenplum_path.sh"
#
# tl;dr: each role must have the same $WHPG_UNIX_USER, $WHPG_UNIX_GROUP
#        and $greenplum_path setting


# Runs on all hosts, always (regardless of --tags).
# Purpose: Read the EDB token and repository from the local files once, for all
#          later plays. The facts persist per host for the rest of the run, so
#          the edb-repository role finds them in every play.
#          Change the file locations here if necessary.
- name: Read EDB token from local files
  hosts: all
  gather_facts: false
  tags: always
  tasks:
    - name: Read token from local file
      ansible.builtin.set_fact:
        edb_token: "{{ lookup('file', lookup('env', 'HOME') ~ '/.edb-token') }}"
      run_once: true
      # hide the token
      no_log: true

# separate task, not using no_log for the repository
- name: Read EDB repository from local files
  hosts: all
  gather_facts: false
  tags: always
  tasks:
    - name: Read repository from local file
      ansible.builtin.set_fact:
        edb_repository: "{{ lookup('file', lookup('env', 'HOME') ~ '/.edb-repository') }}"
      run_once: true


# wem_stack and monitoring_stack are groups defined in the inventory
#   wem_stack        — WEM dashboard + its state PostgreSQL (the wem_host)
#   monitoring_stack — ClickHouse + OTel gateway collector (the monitoring_host,
#                      falling back to wem_host when monitoring_host is not set)
# Both groups hold the same host when monitoring_host == wem_host.

# Runs when: wem_stack is non-empty, i.e. wem_host is set in inventory (e.g.
#            inventory-with-monitoring.yml, inventory-with-standby-and-monitoring.yml,
#            inventory-with-standby-as-monitoring.yml).
# Runs with tags: wem, warehouse-pg-wem-state-database,
#                 warehouse-pg-wem-dashboard, update-pg-hba, acp-host-agent
#                 (the agent connects to the wem_host IP)
# Purpose: Fail fast on localhost with a clear error before touching any remote host,
#          in case wem_host is set to an invalid or misspelled inventory hostname.
# Note: this is not strictly necessary, the roles will fail later as well
- name: Validate wem_host
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tags: [wem, warehouse-pg-wem-state-database, warehouse-pg-wem-dashboard, update-pg-hba, acp-host-agent]
  tasks:
    - name: Validate wem_host points to a valid inventory host
      ansible.builtin.assert:
        that:
          - "'ip_address' in hostvars[item]"
        fail_msg: |
          '{{ item }}' (wem_host) is not a valid inventory host.
          Ensure the host is a member of the wem_stack group in your inventory file
          (generated by Testing/main.tf).
          Valid hostnames: {{ groups['all'] | select('in', hostvars) | map('extract', hostvars) | selectattr('ip_address', 'defined') | map(attribute='inventory_hostname') | list }}
      loop: "{{ groups['wem_stack'] | default([]) }}"


# Runs when: monitoring_stack is non-empty, i.e. monitoring_host or wem_host is set
#            in inventory.
# Runs with tags: warehouse-pg-clickhouse, warehouse-pg-gateway-collector,
#                 wem, warehouse-pg-wem-dashboard (WEM reads its ClickHouse
#                 address, credentials and gateway endpoint from this host)
# Purpose: Fail fast on localhost with a clear error before touching any remote host,
#          in case monitoring_host (or wem_host, its fallback) is set to an invalid or
#          misspelled inventory hostname.
# Note: this is not strictly necessary, the roles will fail later as well
- name: Validate monitoring_host
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tags: [warehouse-pg-clickhouse, warehouse-pg-gateway-collector, wem, warehouse-pg-wem-dashboard]
  tasks:
    - name: Validate monitoring_host points to a valid inventory host
      ansible.builtin.assert:
        that:
          - "'ip_address' in hostvars[item]"
        fail_msg: |
          '{{ item }}' (monitoring_host, or wem_host when monitoring_host is not set) is not a valid inventory host.
          Ensure the host is a member of the monitoring_stack group in your inventory file
          (generated by Testing/main.tf).
          Valid hostnames: {{ groups['all'] | select('in', hostvars) | map('extract', hostvars) | selectattr('ip_address', 'defined') | map(attribute='inventory_hostname') | list }}
      loop: "{{ groups['monitoring_stack'] | default([]) }}"


# this is preparing the data directory in /data/whpg
# use whatever directory you pick, and update it in the inventory
# the warehouse-pg role will not create the main directory,
# it must exist already

- name: Prepare all servers for database installation
  hosts: whpg_clusters
  become: true
  tags: deploy
  any_errors_fatal: true
  tasks:
    # create the data directory on all hosts
    # the warehouse-pg role requires that $whpg_data_directory already exists
    # This is not necessary for production environments
    - name: Create /data/whpg directory
      ansible.builtin.file:
        path: /data/whpg
        state: directory
        mode: '0755'



# actual installation happens from here on
# this is the part you want to transfer into your own Playbooks

- name: Deploy WarehousePG on all clusters
  hosts: whpg_clusters
  become: true
  any_errors_fatal: true
  tags: deploy
  # Uncomment to override the shared defaults for this play:
  # vars:
  #   WHPG_UNIX_USER: "gpadmin"
  #   WHPG_UNIX_GROUP: "gpadmin"
  #   greenplum_path: "/usr/edb/whpg7/greenplum_path.sh"
  roles:
    - role: edb-repository
    - role: warehouse-pg


- name: Collect WarehousePG cluster data
  hosts: whpg_clusters
  become: true
  any_errors_fatal: false
  tags: cluster-data
  # Uncomment to override the shared defaults for this play:
  # vars:
  #   WHPG_UNIX_USER: "gpadmin"
  #   WHPG_UNIX_GROUP: "gpadmin"
  #   greenplum_path: "/usr/edb/whpg7/greenplum_path.sh"
  roles:
    - role: warehouse-pg-cluster-data


- name: Deploy ClickHouse on monitoring host
  hosts: monitoring_stack
  become: true
  any_errors_fatal: true
  tags: [warehouse-pg-clickhouse]
  roles:
    - role: edb-repository
    - role: warehouse-pg-clickhouse


# Runs only when gateway_collector_enabled is true on the monitoring host.
- name: Deploy OTel gateway collector on monitoring host
  hosts: monitoring_stack
  become: true
  any_errors_fatal: true
  tags: [warehouse-pg-gateway-collector]
  roles:
    - role: edb-repository
    - role: warehouse-pg-gateway-collector


- name: Install PostgreSQL state database for WEM
  hosts: wem_stack
  become: true
  any_errors_fatal: true
  tags: [wem, warehouse-pg-wem-state-database]
  roles:
    - role: edb-repository
    - role: warehouse-pg-wem-state-database


# NOTE: When a host is targeted by both this play and one of the earlier
# `whpg_clusters` plays (i.e. WEM is co-located on a coordinator or standby),
# the `WHPG_UNIX_USER` and `WHPG_UNIX_GROUP` variables must hold the same
# values in both plays. Both roles create / chown files for that user, and a
# mismatch would leave the host with two different identities for the same
# files. The simplest way to guarantee this is to set the variables once in
# inventory / group_vars rather than per-play.
- name: Install WarehousePG Enterprise Manager
  hosts: wem_stack
  become: true
  any_errors_fatal: true
  tags: [wem, warehouse-pg-wem-dashboard]
  roles:
    - role: edb-repository
    - role: warehouse-pg-wem-dashboard



- name: Deploy ACP host agent on all cluster nodes
  hosts: whpg_clusters
  become: true
  any_errors_fatal: true
  tags: [acp-host-agent]
  roles:
    - role: edb-repository
    - role: acp-host-agent

